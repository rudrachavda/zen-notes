<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>All Notes</title>
  <link rel="icon" href="icons/note.svg">
  <link rel="stylesheet" href="dist/library.css">
</head>
<body>
  <header class="bar">
    <h1>Notes</h1>
    <div class="search">
      <span data-icon="search"></span>
      <input id="search" type="search" placeholder="Search notes" autocomplete="off" spellcheck="false">
    </div>
    <button id="new" class="primary">New note</button>
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden></p>
    <p id="error" class="empty error" hidden></p>
  </main>

  <div id="confirm" class="overlay" hidden>
    <div class="dialog" role="alertdialog" aria-labelledby="confirm-title">
      <img src="icons/note.svg" alt="" class="dialog-icon">
      <h2 id="confirm-title">Are you sure you want to delete this note?</h2>
      <p>It will be moved to the Trash.</p>
      <div class="dialog-actions">
        <button id="confirm-cancel" class="secondary">Cancel <kbd>esc</kbd></button>
        <button id="confirm-delete" class="danger">Delete <kbd>↩</kbd></button>
      </div>
    </div>
  </div>

  <script src="shortcut.js"></script>
  <script src="dist/library.js"></script>
</body>
</html>
